# Kernel-side package for the bundled fold skill. It only talks to the host
# through rlm.host_request and rlm.emit; prime-agent-runtime is always
# installed in the kernel venv before skills, so it is intentionally not
# declared as a dependency (it is not published on PyPI).
[project]
name = "fold"
version = "0.1.0"
description = "Prime Agent fold skill: context folding over the host bridge"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fold"]
