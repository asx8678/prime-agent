# cargo-deny configuration for the prime-agent Rust workspace.
# Runs in CI (ci.yml) and locally via `make deny`.

[graph]
all-features = true

[advisories]
version = 2
# Fail the build on any reachable vulnerability or withdrawn advisory.
yanked = "deny"
# Triaged exceptions — every entry must carry a reason and a review date;
# a landed fix upstream means the entry is removed instead of silenced.
ignore = [
  # Marvin Attack timing sidechannel in rsa; no patch exists upstream
  # (RustCrypto/RSA#626 tracks it). pa-core/pa-cli use rsa for the Prime
  # browser logins: OAEP encryption to the server's public key, and one OAEP
  # decryption of the login result under a fresh per-login 2048-bit key. The
  # attack needs many timed decryptions under one key; a key that decrypts
  # once offers no oracle. Reviewed 2026-10-11; re-triage when rsa publishes
  # a fix or a long-lived private key appears.
  { id = "RUSTSEC-2023-0071", reason = "unpatched upstream; rsa private keys are per-login and decrypt one result, so no timing oracle exists (reviewed 2026-10-11)" },
  # `paste` proc-macro is unmaintained; pulled by ratatui (build-time only,
  # no vulnerable code path). Reviewed 2026-09-17; revisit when ratatui
  # drops the dep.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro via ratatui, build-time only (reviewed 2026-09-17)" },
  # `unsafe-libyaml` is unmaintained (informational, RUSTSEC-2024-0449), pulled
  # by `serde_yaml` 0.9 (deprecated). pa-core parses skill frontmatter with it:
  # local markdown files the user installed, the same trust as the skill code
  # itself; pa-cli uses it only in tests. A parser swap changes which YAML the
  # TS product's frontmatter reader accepts, so it lands as its own parity
  # change. Reviewed 2026-10-13; re-triage when a maintained serde YAML crate
  # matches js-yaml on the frontmatter corpus, or an actual vulnerability is filed.
  { id = "RUSTSEC-2024-0449", reason = "unmaintained libyaml port behind serde_yaml; parses local skill frontmatter only, parser swap is a parity change (reviewed 2026-10-13)" },
]

[licenses]
version = 2
# Deny-by-default; the allowlist below is the exact set carried by the
# dependency graph (verified with `cargo deny check licenses`).
# The exact set carried by the dependency graph (verified with
# `cargo deny check licenses`); unmatched entries are removed on bump.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
# Development-only tools are not shipped; we keep the graph tight instead of
# adding private/exceptions stanzas.

[bans]
# Multiple versions of a crate are allowed (few genuine duplicates exist and
# cargo resolves them fine); duplicates and wildcards are surfaced instead.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Everything must come from crates.io or vendored path dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
